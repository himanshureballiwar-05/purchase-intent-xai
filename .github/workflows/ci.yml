name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check src tests dashboard
      - name: Format check (black)
        run: black --check src tests dashboard
      - name: Tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t purchase-intent-api:ci .
      - name: Build dashboard image
        run: docker build -f docker/Dockerfile.dashboard -t purchase-intent-dashboard:ci .
